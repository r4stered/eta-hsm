name: Linux_CI

on: [push, pull_request]

jobs:
  cpp_linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run clang-format style check for C++ files
        uses: jidicula/clang-format-action@v4.13.0
        with:
          clang-format-version: '21'  # understands C++26 reflection (^^) syntax
          check-path: 'eta_hsm'
          exclude-regex: ''

  # Mirrors the local pre-commit `gersemi` hook (.gersemirc pins the config and
  # teaches it the custom eta_add_negcompile_test command). Closes the last
  # formatting gap alongside buildifier (Bazel) and clang-format (C++).
  cmake_format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install gersemi
        run: pip install gersemi==0.27.7
      - name: Check CMake formatting
        run: gersemi --check CMakeLists.txt eta_hsm tests

  # GCC 16 / C++26 reflection toolchain (ADR-0001). Runs inside an ubuntu:26.04
  # container because that is the first image shipping g++-16. Matrixed across
  # native x86_64 and arm64 GitHub-hosted runners (no QEMU): the multi-arch
  # ubuntu:26.04 manifest resolves to the runner's own arch, so each leg builds
  # and tests natively. Both legs must pass.
  cmake_tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++-16 gcc-16 binutils cmake ninja-build make git ca-certificates
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-16
      - name: Build and test (CMake)
        run: |
          cmake --preset default
          cmake --build --preset default
          ctest --preset default
      - name: find_package(EtaHsm) consumer
        # Builds a real Machine<> over the machine/ headers, so a regression in the
        # install header set fails here. All scratch nested under build/
        # (git-ignored) so nothing leaks into the tree.
        run: |
          cmake --install build --prefix "$PWD/build/install"
          cmake -S tests/consumer -B build/consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/build/install"
          cmake --build build/consumer
          ./build/consumer/consumer
      - name: FetchContent(EtaHsm) consumer
        # The default FetchContent path (no SOURCE_SUBDIR). The project's CMake
        # asserts at configure time that no developer-only target (the tool,
        # GoogleTest) leaked into the subdirectory build, then builds the same
        # real-Machine<> consumer.
        run: |
          cmake -S tests/consumer-fetchcontent -B build/consumer-fc -G Ninja
          cmake --build build/consumer-fc
          ./build/consumer-fc/consumer

  # Same GCC 16 / C++26 container as cmake_tests (ADR-0001 — no native multi-OS),
  # but the GTest suite is built with -fsanitize=address,undefined to catch
  # out-of-bounds on the fixed-capacity table storage and UB in the dispatch /
  # LCA exit-entry chain. -fno-sanitize-recover=all makes any finding fail the run.
  # Matrixed across both arches like cmake_tests, so an arch-specific UB or
  # out-of-bounds is caught wherever it manifests.
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++-16 gcc-16 binutils cmake ninja-build make git ca-certificates
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-16
      - name: Build and test under ASan + UBSan
        run: |
          cmake --preset sanitizer
          cmake --build --preset sanitizer
          ctest --preset sanitizer

  # Same GCC 16 / C++26 container as cmake_tests (ADR-0001). Builds the GTest
  # suite under GCC's --coverage instrumentation and reduces the .gcda/.gcno with
  # gcovr into a line-coverage %. CMake path only, mirroring the sanitizers job;
  # `bazel coverage` is out of scope. Matrixed across both arches so a coverage
  # build that breaks on one arch is caught; the % is line coverage of the source
  # and so arch-independent, so only the x86_64 leg publishes the badge.
  coverage:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++-16 gcc-16 binutils cmake ninja-build make git ca-certificates gcovr
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-16
      - name: Measure coverage
        # All scratch nested under build/coverage/ (git-ignored). Tee the gcovr
        # summary aside so the later steps can lift the % out of it.
        run: bash tools/coverage.sh 2>&1 | tee /tmp/coverage.log
      - name: Publish coverage to job summary
        run: |
          {
            echo "### Test coverage"
            echo
            echo '```'
            grep -E '^(lines|functions|branches):' /tmp/coverage.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        # Per-arch artifact name so the two matrix legs do not collide on upload.
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report-${{ matrix.runner }}
          path: build/coverage/report/
      - name: Extract coverage percentage
        id: cov
        run: |
          pct=$(grep -oE '^lines: [0-9.]+%' /tmp/coverage.log | grep -oE '[0-9.]+' | head -1)
          if [ -z "$pct" ]; then
            echo "::error::could not parse a line-coverage % from the gcovr summary"
            exit 1
          fi
          band=${pct%.*}
          if   [ "$band" -ge 90 ]; then color=brightgreen
          elif [ "$band" -ge 80 ]; then color=green
          elif [ "$band" -ge 70 ]; then color=yellowgreen
          elif [ "$band" -ge 60 ]; then color=yellow
          elif [ "$band" -ge 50 ]; then color=orange
          else color=red
          fi
          echo "pct=${pct}" >>"$GITHUB_OUTPUT"
          echo "color=${color}" >>"$GITHUB_OUTPUT"
      # Publish the % to a gist that backs the README's shields.io endpoint badge.
      # The write is an idempotent gist update (not a commit to this repo), so it
      # never races other pushes to v2 and leaves no badge commits in history.
      # Only on a direct push to v2 -- PRs from forks have no access to the secret.
      #
      # One-time setup (done on the fork):
      #   1. Create a public gist with a file named eta-hsm-coverage.json.
      #   2. Create a PAT with only the `gist` scope; add it as the repo secret
      #      GIST_SECRET.
      #   3. Set the gist id as the repo variable GIST_ID, and put it in the badge
      #      URL in README.md.
      - name: Update coverage badge gist
        # Single-writer: only the x86_64 leg publishes, so the two arch legs never
        # race or double-write the gist. The % is arch-independent.
        if: matrix.runner == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/v2'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.GIST_ID }}
          filename: eta-hsm-coverage.json
          label: coverage
          message: ${{ steps.cov.outputs.pct }}%
          color: ${{ steps.cov.outputs.color }}

  # Publishes an overall pipeline pass/fail badge to the SAME gist that backs the
  # coverage badge (a second file, eta-hsm-ci.json, in the same gist), via the same
  # dynamic-badges-action. Runs after every other job and reports `failing` if any of
  # them did not succeed, `passing` otherwise. Only on a direct push to v2 -- PRs from
  # forks have no access to the gist secret. The CI file rides the GIST_ID/GIST_SECRET
  # set up for coverage above; no extra setup beyond adding eta-hsm-ci.json to the URL
  # in README.md.
  #
  # Itself un-matrixed, so the badge is written exactly once. A `needs` on a
  # matrixed job aggregates all of its arch legs into one result, so a failure on
  # either arch flips the badge to failing -- both arches must pass for `passing`.
  ci_status:
    runs-on: ubuntu-latest
    needs: [cpp_linting, cmake_format, cmake_tests, sanitizers, coverage, bazel_tests]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/v2'
    steps:
      - name: Resolve pipeline status
        id: status
        # join() folds every needed job's result into one string; a failed or
        # cancelled job anywhere flips the badge to failing.
        run: |
          if echo '${{ join(needs.*.result, ',') }}' | grep -qE 'failure|cancelled'; then
            echo "message=failing" >>"$GITHUB_OUTPUT"
            echo "color=red" >>"$GITHUB_OUTPUT"
          else
            echo "message=passing" >>"$GITHUB_OUTPUT"
            echo "color=brightgreen" >>"$GITHUB_OUTPUT"
          fi
      - name: Update CI badge gist
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.GIST_ID }}
          filename: eta-hsm-ci.json
          label: CI
          message: ${{ steps.status.outputs.message }}
          color: ${{ steps.status.outputs.color }}

  # Same GCC 16 / C++26 container, matrixed across both arches. The bazelisk
  # release is arch-specific, so each leg downloads the binary matching its runner.
  bazel_tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            bazelisk_arch: amd64
          - runner: ubuntu-24.04-arm
            bazelisk_arch: arm64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    timeout-minutes: 30
    env:
      CC: gcc-16
      CXX: g++-16
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++-16 gcc-16 git ca-certificates curl python3
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-16
          curl -fsSL -o /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-${{ matrix.bazelisk_arch }}
          chmod +x /usr/local/bin/bazel
      - name: Test (Bazel)
        run: bazel test //... --test_output=errors
